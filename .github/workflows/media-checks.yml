name: Media regression checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test deletion authorization and failure handling
        run: node --test worker/*.test.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - name: Test deletion error messages
        run: flutter test test/media_deletion_error_test.dart
      - name: Compile web app
        run: flutter build web --release
